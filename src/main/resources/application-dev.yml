spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:carbonfootprint}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # Local development defaults so the project can run directly from IDEA.
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zsh20031013*}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Keep MySQL data intact during normal development runs.
      # Use the explicit init profile once when the schema/seed data needs bootstrapping.
      mode: never
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.zhangsihan.carbonfootprint: INFO

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  baidu-ocr:
    api-key: ${BAIDU_OCR_API_KEY:e53CntkqvOGnAeKiePcANksB}
    secret-key: ${BAIDU_OCR_SECRET_KEY:JxzBvTaqMKmTcsrHCQrHJT8Z3ZGUe890}
    token-url: ${BAIDU_OCR_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}
    recognize-url: ${BAIDU_OCR_RECOGNIZE_URL:https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic}
    max-image-size: ${BAIDU_OCR_MAX_IMAGE_SIZE:8388608}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-f20ada241fae4e868351dc17f797562d}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    chat-url: ${DEEPSEEK_CHAT_URL:https://api.deepseek.com/chat/completions}
    read-timeout: ${DEEPSEEK_READ_TIMEOUT:60s}
