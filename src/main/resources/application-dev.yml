spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:carbonfootprint}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # Local development defaults so the project can run directly from IDEA.
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:zsh20031013*}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Keep MySQL data intact during normal development runs.
      # Use the explicit init profile once when the schema/seed data needs bootstrapping.
      mode: never
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: smtp.163.com
    port: 465
    username: ${MAIL_USERNAME:13507242330@163.com}
    password: ${MAIL_PASSWORD:VMcUzAWCmEZ4wUjg}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
            trust: smtp.163.com
          starttls:
            enable: false

logging:
