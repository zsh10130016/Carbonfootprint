spring:
  application:
    name: carbonfootprint
  profiles:
    active: dev

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.zhangsihan.carbonfootprint.entity,com.zhangsihan.carbonfootprint.vo
  configuration:
    map-underscore-to-camel-case: true

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:carbonfootprint-demo-secret-carbonfootprint-demo-secret}
    expiration-millis: ${APP_JWT_EXPIRATION_MILLIS:86400000}
  baidu-ocr:
    api-key: ${BAIDU_OCR_API_KEY:e53CntkqvOGnAeKiePcANksB}
    secret-key: ${BAIDU_OCR_SECRET_KEY:JxzBvTaqMKmTcsrHCQrHJT8Z3ZGUe890}
    token-url: https://aip.baidubce.com/oauth/2.0/token
    ocr-url: https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic
    max-upload-size: 4MB
